worker_processes auto;
pid /tmp/nginx.pid; 
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server {
        listen 3000;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html;
        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
        location / { try_files $uri $uri/ /index.html; }
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ { expires 6M; access_log off; add_header Cache-Control "public, no-transform"; }
        location /health { access_log off; add_header 'Content-Type' 'application/json'; return 200 '{"status":"UP"}'; }
        location ~ /\. { deny all; access_log off; log_not_found off; }
    }
}