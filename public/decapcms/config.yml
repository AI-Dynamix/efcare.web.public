backend:
  name: git-gateway
  branch: master

media_folder: public/uploads
public_folder: /uploads
locale: vi

collections:
  - name: blog
    label: Bài viết
    folder: src/content/post
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Mô tả, name: description, widget: text }
      - { label: Ngày đăng, name: publishDate, widget: datetime }
      - { label: Ảnh đại diện, name: image, widget: image, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Nội dung, name: body, widget: markdown }

  # Note: TypeScript data files (src/data/efcare/*.ts) require a site rebuild to apply.
  # Admins can edit content directly in:
  #   src/data/efcare/site.ts        — Company info, hotline, address, socials
  #   src/data/efcare/hero.ts        — Hero section content
  #   src/data/efcare/about.ts       — About section content
  #   src/data/efcare/technology.ts  — Technology cards
  #   src/data/efcare/services.ts    — Services cards
  #   src/data/efcare/values.ts      — Core values (Ngũ Tâm)
  #   src/data/efcare/partners.ts    — Partners section
  #   src/data/efcare/navigation.ts  — Nav links and footer columns
